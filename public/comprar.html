<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Adquirir Passe Booyah — Free Fire</title>
  <meta
    name="description"
    content="Confirme sua conta, pague com Pix e receba o Passe Booyah do Free Fire de forma rápida e segura."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&family=Russo+One&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/fluxo.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="index.html" aria-label="Voltar ao início">
      <svg class="site-brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M16 1c.6 4.2-1.6 6.1-4 7.4C9.4 9.9 6 11.3 5.2 15.6 4.4 20 7.9 22.7 9 24.2 7.2 23.6 4.6 21.3 4.6 17.9 4.6 13 9.4 9.8 11 8.4 11.3 5.4 13.2 2.6 16 1Z" fill="currentColor" />
        <path d="M20.5 8.1c2.7 3 3.5 7.3 1.4 10.9 1.8-1.5 3.1-4.4 1.9-8.2-.5-1.6-1.7-2.8-3.3-2.7Z" fill="currentColor" />
        <path d="M18 31c-1.9-5.6.1-9.8 3.2-12.6 3-2.7 5.8-5.2 5.2-10.4-1.8 4.4-5.5 7.1-8.3 8.5-3.4 1.7-6.6 4.6-6.1 9.5.4 4.4 4.1 5.9 6 5Z" fill="currentColor" />
      </svg>
      <span class="site-brand__name">Free&nbsp;Fire</span>
    </a>
    <a class="site-back" href="index.html">← Voltar</a>
  </header>

  <main class="page">
    <h1 class="page__title">Adquira seu <span>Passe Booyah</span></h1>
    <p class="page__subtitle">
      Confirme sua conta, pague com Pix e receba o passe.
    </p>

    <form id="fluxo-form" novalidate>
      <div class="field">
        <label class="field__label" for="uid">UID do jogador</label>
        <input
          class="field__input"
          id="uid"
          name="uid"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Ex.: 16046839641"
          required
        />
      </div>

      <div class="field">
        <label class="field__label" for="region">Região</label>
        <input
          class="field__input"
          id="region"
          name="region"
          type="text"
          value="BR"
          maxlength="4"
          autocomplete="off"
          placeholder="BR"
        />
      </div>

      <div class="field">
        <label class="field__label" for="email">E-mail (para o Pix)</label>
        <input
          class="field__input"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="voce@exemplo.com"
          required
        />
      </div>

      <button class="btn btn--ghost" type="button" id="confirmar-btn">
        Confirmar jogador
      </button>
    </form>

    <section class="conta-card" id="conta-card" aria-live="polite" hidden>
      <p class="conta-card__name" id="conta-nome"></p>
      <div class="conta-card__meta" id="conta-meta"></div>
      <p class="conta-card__confirm" id="conta-confirm"></p>
    </section>

    <section class="pix" id="pix-section" hidden>
      <img class="pix__qr" id="pix-qr" alt="QR Code Pix" />
      <p class="pix__hint">Escaneie o QR Code ou use o Pix copia e cola.</p>

      <div class="pix__copy-row">
        <textarea class="pix__copy" id="pix-copia" readonly rows="3"></textarea>
        <button class="btn btn--ghost pix__copy-btn" type="button" id="pix-copiar-btn">
          Copiar
        </button>
      </div>

      <a class="pix__link" id="pix-link" href="#" target="_blank" rel="noopener">
        Abrir no Mercado Pago
      </a>

      <p class="status status--info pix__status" id="pix-status" role="status" aria-live="polite">
        Aguardando pagamento...
      </p>
    </section>

    <p class="status" id="fluxo-status" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="js/comprar.js"></script>
</body>
</html>
